name: Build Policia BR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            flex \
            gcc \
            g++ \
            libelf-dev \
            make \
            texinfo \
            libncurses5-dev \
            patch \
            python3 \
            subversion \
            wget \
            zlib1g-dev \
            libtool \
            libtool-bin \
            bzip2 \
            libgmp-dev \
            pkg-config \
            libssl-dev \
            clang \
            xz-utils

      - name: Baixar PS3DEV
        run: |
          wget -O /tmp/ps3dev.tar.gz \
            https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz

      - name: Instalar PS3DEV
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo tar -xzf /tmp/ps3dev.tar.gz \
            -C /usr/local/ps3dev \
            --strip-components=1

      - name: Configurar ambiente PS3
        run: |
          echo "PS3DEV=/usr/local/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=/usr/local/ps3dev" >> "$GITHUB_ENV"
          echo "/usr/local/ps3dev/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps3dev/ppu/bin" >> "$GITHUB_PATH"
          echo "/usr/local/ps3dev/spu/bin" >> "$GITHUB_PATH"

      - name: Verificar toolchain
        run: |
          which ppu-gcc
          which ppu-g++
          ppu-gcc --version
          test -f "$PSL1GHT/ppu_rules"
          echo "PSL1GHT encontrado."

      - name: Verificar ferramentas PS3
        run: |
          echo "=== COMPILADOR PPU ==="
          which ppu-gcc
          which ppu-g++

          echo "=== FERRAMENTAS PS3 ==="
          which sprxlinker || true
          which fself || true
          which make_self || true
          which make_self_npdrm || true

          echo "=== VERSAO DO COMPILADOR ==="
          ppu-gcc --version

          echo "=== SPRXLINKER ==="
          sprxlinker || true

      - name: Compilar projeto PS3
        run: |
          make clean || true
          make VERBOSE=1 policia_br.self

      - name: Testar sprxlinker
        run: |
          echo "=== TESTE SPRXLINKER ==="
          sprxlinker policia_br.elf || true

          echo "=== ARQUIVOS APOS SPRXLINKER ==="
          find . -maxdepth 2 -type f \( \
            -name "*.elf" -o \
            -name "*.sprx" -o \
            -name "*.prx" \
          \) -print

      - name: Mostrar arquivos gerados
        run: |
          echo "=== ARQUIVOS PS3 GERADOS ==="
          find . -type f \( \
            -name "*.o" -o \
            -name "*.elf" -o \
            -name "*.self" \
          \) -print

      - name: Publicar executaveis
        uses: actions/upload-artifact@v4
        with:
          name: PoliciaBR-PS3
          path: |
            policia_br.elf
            policia_br.self
          if-no-files-found: error
